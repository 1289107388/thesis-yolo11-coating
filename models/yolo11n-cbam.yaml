# YOLOv11n + CBAM 注意力（实验 C）
# CBAM 插在 P3/P4/P5 三个检测分支的 C3k2 之后、进 Detect / 下采样之前。
# 注意：CBAM 的通道参数填的是 n 尺度缩放后的实际通道（256*0.25=64 等），仅适用于 n 尺度。
nc: 2
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [512, False]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15
  - [-1, 2, C3k2, [256, False]] # 16 P3/8
  - [-1, 1, CBAM, [64]] # 17
  - [-1, 1, Conv, [256, 3, 2]] # 18 down
  - [[-1, 13], 1, Concat, [1]] # 19
  - [-1, 2, C3k2, [512, False]] # 20 P4/16
  - [-1, 1, CBAM, [128]] # 21
  - [-1, 1, Conv, [512, 3, 2]] # 22 down
  - [[-1, 10], 1, Concat, [1]] # 23
  - [-1, 2, C3k2, [1024, True]] # 24 P5/32
  - [-1, 1, CBAM, [256]] # 25
  - [[17, 21, 25], 1, Detect, [nc]] # Detect(P3, P4, P5)
