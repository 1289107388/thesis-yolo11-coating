# YOLOv11n + P2 检测头 + CBAM（实验 F 组合）
# P2 分支见 yolo11n-p2.yaml；CBAM 插在 P2/P3/P4/P5 四个检测分支输出处。
# CBAM 通道参数为 n 尺度实际通道（128*0.25=32 等），仅适用于 n 尺度。
nc: 2
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [512, False]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15
  - [-1, 2, C3k2, [256, False]] # 16 P3/8
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 P2/4
  - [-1, 1, CBAM, [32]] # 20
  - [-1, 1, Conv, [128, 3, 2]] # 21 down
  - [[-1, 16], 1, Concat, [1]] # 22 cat head P3
  - [-1, 2, C3k2, [256, False]] # 23 P3/8
  - [-1, 1, CBAM, [64]] # 24
  - [-1, 1, Conv, [256, 3, 2]] # 25 down
  - [[-1, 13], 1, Concat, [1]] # 26 cat head P4
  - [-1, 2, C3k2, [512, False]] # 27 P4/16
  - [-1, 1, CBAM, [128]] # 28
  - [-1, 1, Conv, [512, 3, 2]] # 29 down
  - [[-1, 10], 1, Concat, [1]] # 30 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 31 P5/32
  - [-1, 1, CBAM, [256]] # 32
  - [[20, 24, 28, 32], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
